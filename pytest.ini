[pytest]
# 测试文件匹配规则
python_files = test_*.py
# 测试类匹配规则
python_classes = Test*
# 测试方法匹配规则
python_functions = test_*
# 命令行默认参数
addopts = -v --tb=short --alluredir=reports/allure-results --clean-alluredir -p no:cacheprovider
# 每条用例超时时间（5分钟，防止卡死）
timeout = 300
# 标记定义
markers =
    login: 登录相关测试用例
    case_list: 案例列表相关测试用例
    add_case: 新增案例相关测试用例
    smoke: 冒烟测试用例
